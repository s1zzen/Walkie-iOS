name: Walkie
options:
  bundleIdPrefix: dev.walkie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WalkieCore:
    path: Packages/WalkieCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Walkie:
    type: application
    platform: iOS
    sources: [Walkie]
    dependencies:
      - package: WalkieCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.walkie.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Walkie/Walkie.entitlements
        WALKIE_BACKEND_URL: "http://178.72.149.13/api"
      configs:
        Debug:
          INFOPLIST_FILE: DebugInfo.plist
  WalkieTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WalkieTests]
    dependencies:
      - target: Walkie
      - package: WalkieCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WalkieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WalkieUITests]
    dependencies:
      - target: Walkie
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Walkie:
    build:
      targets:
        Walkie: all
        WalkieTests: [test]
        WalkieUITests: [test]
    test:
      targets: [WalkieTests, WalkieUITests]
